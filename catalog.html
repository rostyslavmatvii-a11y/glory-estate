<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог нерухомості — Glory Estate</title>
  <meta name="description" content="Квартири, будинки й комерційна нерухомість у Києві та області: продаж і оренда з фільтрами за ціною, площею і кімнатами.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="catalog">
  <div id="header"></div>

  <main class="container">
    <div class="crumbs"><a href="index.html">Головна</a> / <span id="crumb">Каталог</span></div>
    <div class="section-head" style="margin-bottom:20px">
      <div><h1 id="title" style="font-size:clamp(1.8rem,3.5vw,2.6rem)">Каталог</h1></div>
      <button class="btn btn-ghost filters-toggle" id="filtersToggle"></button>
    </div>

    <div class="catalog">
      <div class="sheet-backdrop" id="filtersBackdrop"></div>
      <aside class="filters" id="filters">
        <h3>Фільтри <span class="sheet-x"><button class="icon-btn" id="filtersClose" aria-label="Закрити фільтри"></button></span><button class="btn btn-ghost" id="reset" style="padding:6px 10px;font-size:.85rem">Скинути</button></h3>
        <div class="field"><label>Угода</label><div class="pills" data-key="deal">
          <button data-v="">Усі</button><button data-v="sale">Продаж</button><button data-v="rent">Оренда</button></div></div>
        <div class="field"><label>Тип</label><div class="pills" data-key="type">
          <button data-v="">Усі</button><button data-v="Квартира">Квартира</button><button data-v="Будинок">Будинок</button><button data-v="Комерція">Комерція</button></div></div>
        <div class="field"><label>Кімнат</label><div class="pills" data-key="rooms">
          <button data-v="">Усі</button><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4+</button></div></div>
        <div class="field"><label for="fCity">Місто</label><select id="fCity"></select></div>
        <div class="field"><label for="fDistrict">Район</label><select id="fDistrict"></select></div>
        <div class="field"><label>Ціна, ₴</label><div class="row2"><input id="fMin" inputmode="numeric" placeholder="від"><input id="fMax" inputmode="numeric" placeholder="до"></div></div>
        <div class="field"><label>Площа, м²</label><div class="row2"><input id="fAreaMin" inputmode="numeric" placeholder="від"><input id="fAreaMax" inputmode="numeric" placeholder="до"></div></div>
        <div class="field" style="margin:0"><label><input type="checkbox" id="fFav" style="width:auto;margin-right:6px">Лише обране</label></div>
        <div class="sheet-foot"><button class="btn btn-primary btn-block" id="filtersApply"></button></div>
      </aside>

      <section>
        <div class="toolbar">
          <span class="muted" id="count"></span>
          <select id="sort" aria-label="Сортування">
            <option value="new">Спочатку нові</option>
            <option value="cheap">Спочатку дешевші</option>
            <option value="exp">Спочатку дорожчі</option>
            <option value="area">За площею</option>
          </select>
        </div>
        <div class="grid" id="grid"></div>
      </section>
    </div>
  </main>

  <div id="footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const { $, $$, card, icon, syncFavs, favs, reveal } = UI;
    const qs = new URLSearchParams(location.search);
    const st = {
      deal: qs.get('deal') || '', type: qs.get('type') || '', rooms: qs.get('rooms') || '', city: qs.get('city') || '',
      district: '', min: '', max: qs.get('max') || '', areaMin: '', areaMax: '', fav: qs.get('fav') === '1', sort: 'new',
    };
    const num = (v) => Number(String(v).replace(/\D/g, '')) || 0;
    const cities = [...new Set(LISTINGS.map((p) => p.city))];
    $('#fCity').innerHTML = '<option value="">Усі</option>' + cities.map((c) => `<option>${c}</option>`).join('');
    const fillDistricts = () => {
      const ds = [...new Set(LISTINGS.filter((p) => !st.city || p.city === st.city).map((p) => p.district))];
      $('#fDistrict').innerHTML = '<option value="">Усі</option>' + ds.map((d) => `<option>${d}</option>`).join('');
      $('#fDistrict').value = st.district;
    };

    function syncControls() {
      $$('.pills').forEach((g) => $$('button', g).forEach((b) => b.classList.toggle('on', b.dataset.v === st[g.dataset.key])));
      $('#fCity').value = st.city; fillDistricts();
      $('#fMax').value = st.max; $('#fMin').value = st.min; $('#fAreaMin').value = st.areaMin; $('#fAreaMax').value = st.areaMax;
      $('#fFav').checked = st.fav; $('#sort').value = st.sort;
    }

    function render() {
      const f = favs();
      let list = LISTINGS.filter((p) =>
        (!st.deal || p.deal === st.deal) && (!st.type || p.type === st.type) &&
        (!st.rooms || (st.rooms === '4' ? p.rooms >= 4 : p.rooms === +st.rooms)) &&
        (!st.city || p.city === st.city) && (!st.district || p.district === st.district) &&
        (!st.min || p.price >= num(st.min)) && (!st.max || p.price <= num(st.max)) &&
        (!st.areaMin || p.area >= num(st.areaMin)) && (!st.areaMax || p.area <= num(st.areaMax)) &&
        (!st.fav || f.includes(p.id)));
      const by = { new: (a, b) => b.year - a.year, cheap: (a, b) => a.price - b.price, exp: (a, b) => b.price - a.price, area: (a, b) => b.area - a.area };
      list.sort(by[st.sort]);
      const t = st.fav ? 'Обране' : st.deal === 'rent' ? 'Оренда нерухомості' : st.deal === 'sale' ? 'Продаж нерухомості' : 'Каталог нерухомості';
      $('#title').textContent = t; $('#crumb').textContent = t; document.title = t + ' — ' + AGENCY.name;
      const n = list.length;
      $('#filtersApply').textContent = n ? `Показати ${n}` : 'Нічого не знайдено';
      const active = ['deal', 'type', 'rooms', 'city', 'district', 'min', 'max', 'areaMin', 'areaMax', 'fav'].filter((k) => st[k]).length;
      $('#filtersToggle').innerHTML = icon('filter', 16) + ' Фільтри' + (active ? ` <span class="f-badge">${active}</span>` : '');
      $('#count').textContent = `Знайдено ${n} ${n % 10 === 1 && n % 100 !== 11 ? "об'єкт" : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? "об'єкти" : "об'єктів"}`;
      $('#grid').innerHTML = n ? list.map(card).join('') :
        `<div class="empty" style="grid-column:1/-1"><h3>Нічого не знайшли</h3><p class="muted">Спробуйте змінити фільтри — або залиште заявку, і ми підберемо варіанти, яких ще немає на сайті.</p><a class="btn btn-primary" href="contacts.html">Залишити заявку</a></div>`;
      syncFavs(); reveal();
      const q = new URLSearchParams(); ['deal', 'type', 'rooms', 'city', 'max'].forEach((k) => st[k] && q.set(k, st[k])); if (st.fav) q.set('fav', '1');
      history.replaceState(null, '', 'catalog.html' + (q.toString() ? '?' + q : ''));
    }

    $$('.pills').forEach((g) => g.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return; st[g.dataset.key] = b.dataset.v; syncControls(); render();
    }));
    $('#fCity').onchange = (e) => { st.city = e.target.value; st.district = ''; fillDistricts(); render(); };
    $('#fDistrict').onchange = (e) => { st.district = e.target.value; render(); };
    [['#fMin', 'min'], ['#fMax', 'max'], ['#fAreaMin', 'areaMin'], ['#fAreaMax', 'areaMax']].forEach(([s, k]) => $(s).addEventListener('input', (e) => { st[k] = e.target.value; render(); }));
    $('#fFav').onchange = (e) => { st.fav = e.target.checked; render(); };
    $('#sort').onchange = (e) => { st.sort = e.target.value; render(); };
    $('#reset').onclick = () => { Object.assign(st, { deal: '', type: '', rooms: '', city: '', district: '', min: '', max: '', areaMin: '', areaMax: '', fav: false }); syncControls(); render(); };
    // на телефоні фільтри — шторка знизу
    const sheet = (on) => { $('#filters').classList.toggle('open', on); $('#filtersBackdrop').classList.toggle('open', on); document.body.classList.toggle('sheet-open', on); };
    $('#filtersToggle').onclick = () => sheet(true);
    $('#filtersClose').innerHTML = icon('close', 18);
    ['#filtersClose', '#filtersApply', '#filtersBackdrop'].forEach((s) => $(s).addEventListener('click', () => sheet(false)));
    document.addEventListener('click', (e) => { if (e.target.closest('[data-fav]') && st.fav) setTimeout(render, 0); });
    syncControls(); render();
  </script>
</body>
</html>
